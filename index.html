<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Wizards</title><style>html,body{margin:0;height:100%;background:#060a12;color:#ffd700;font-family:Arial,sans-serif}#loading{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}.box{max-width:520px;border:2px solid #ffd700;border-radius:16px;padding:24px;background:#0d1322;box-shadow:0 0 24px rgba(255,215,0,.25)}.spin{font-size:42px;margin-bottom:12px}</style></head><body><div id="loading"><div class="box"><div class="spin">🪄</div><h2>Opening Grammar Wizards…</h2><p>Please wait a moment while the magical realm loads.</p></div></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/g-34414590-lang/grammar-wizards/main/compressed/';const urls=['gw1.txt','gw2.txt','gw3.txt'];const parts=await Promise.all(urls.map(u=>fetch(base+u+'?v=1').then(r=>{if(!r.ok)throw new Error('Could not load game data');return r.text()})));const b64=parts.join('').trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('This browser is too old. Please open the game in Chrome, Edge, Safari 17+, or a recent browser.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div class="box"><h2>Unable to open the game</h2><p>'+String(e.message||e)+'</p><p>Please refresh the page or open it using Google Chrome.</p></div>'}})();</script></body></html>
